
name: Check build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      # Testando checkout sem parâmtros conflita com checkout com parâmetros

      - name: Checkout sem parâmetros
        uses: actions/checkout@v7

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      - name: Checkout doc-base
        uses: actions/checkout@v7
        with:
          repository: php/doc-base
          path: doc-base

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      - name: Checkout doc-en
        uses: actions/checkout@v7
        with:
          repository: php/doc-en
          path: en

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      # Acima, lista mudou? Documentar.


      - name: Checkout doc-pt_br (prev)
        uses: actions/checkout@v7
        with:
          path: pt_br_prev

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      # Checkout PR branch, unmerged

      - name: Checkout doc-pt_br (next)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          path: pt_br
          ref: ${{ github.event.pull_request.head.sha }}

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      # Checkout main/master, and then squash and merge the branch in here

      - name: Merge from main/master (always)
        run: |
          echo ---      pwd
          pwd
          echo ---      branch
          git  -C pt_br branch
          echo ---      status
          git  -C pt_br status
          echo ---      remote
          git  -C pt_br remote -v
          echo ---      log
          # echo ---      fetch
          # git -C pt_br  fetch origin  ${{ github.event.pull_request.base.ref }}

          echo ---      checkout master, by name
          git  -C pt_br checkout ${{ github.event.pull_request.base.ref }}
          git  -C pt_br log -10 --oneline

          echo ---      merge squash, by sha
          git  -C pt_br merge --squash ${{ github.event.pull_request.head.sha }}

          git -C pt_br log -10 --oneline
          echo ---      status
          git -C pt_br status
          echo ---      diff
          git -C pt_br diff

      # Testando pushd modifica caminho permanentemente

      - name: ls doc-base/temp
        run:  ls pt_br/doc-base/temp

      - name: pwd pushd pwd
        run: |
          echo ONE
          pwd
          ls
          pushd ..
          echo ONE
          pwd
          ls

      - name: pwd ls
        run: |
          pwd
          ls

      # Testando para onde o cd puro vai

      - name: cd pwd
        run: |
          cd
          pwd

      - name: env
        run: env

      - name: QA scripts
        run:  php doc-base/scripts/qa/extensions.xml.php --check

      - name: Build documentation for pt_br
        run: php doc-base/configure.php --disable-libxml-check --enable-xml-details --redirect-stderr-to-stdout --with-lang=pt_br 2>&1
