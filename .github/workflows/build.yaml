
name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      - name: Checkout doc-base
        uses: actions/checkout@v7
        with:
          repository: php/doc-base
          path: doc-base

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      - name: Checkout doc-en
        uses: actions/checkout@v7
        with:
          repository: php/doc-en
          path: en

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      - name: Checkout doc-pt_br (prev)
        uses: actions/checkout@v7
        with:
          path: pt_br_prev

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      # Checkout branch, unmerged

      - name: Checkout doc-pt_br (next)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          path: pt_br
          ref: ${{ github.event.pull_request.head.sha }}

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      # Checkout main/master, and then squash and merge the branch in here

      - name: Merge from main/master (always)
        run: |
          set -x
          cd  pt_br

          git remote -v
          git show-ref -d --head
          git show-ref -d --tags
          echo

          echo --- fetch
          git fetch origin ${{ github.event.pull_request.base.ref }}
          echo
          git fetch origin ${{ github.event.pull_request.head.sha }}
          echo
          git fetch origin ${{ github.event.pull_request.head.ref }}
          echo

          echo --- give the detached head a name
          git switch -c detached-${{ github.event.pull_request.head.sha }}
          git log -3 --oneline

          echo --- checkout master, by name
          git checkout ${{ github.event.pull_request.base.ref }}
          git log -3 --oneline

          echo --- merge squash, by sha
          git merge --squash ${{ github.event.pull_request.head.sha }}
          git log -3 --oneline

          echo --- status
          git status
          echo --- diff
          git diff
          echo ---

      # Testando pushd modifica caminho permanentemente

      - name: ls doc-base/temp
        run:  ls pt_br/doc-base/temp

      - name: pwd pushd pwd
        run: |
          echo ONE
          pwd
          ls
          pushd ..
          echo ONE
          pwd
          ls

      - name: pwd ls
        run: |
          pwd
          ls

      # Testando para onde o cd puro vai

      - name: cd pwd
        run: |
          cd
          pwd

      - name: env
        run: env

      - name: QA scripts
        run:  php doc-base/scripts/qa/extensions.xml.php --check

      - name: Build documentation for pt_br
        run: php doc-base/configure.php --disable-libxml-check --enable-xml-details --redirect-stderr-to-stdout --with-lang=pt_br 2>&1
