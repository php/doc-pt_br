
name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: Checkout doc-base
        uses: actions/checkout@v7
        with:
          repository: php/doc-base
          path: doc-base

      - name: Checkout doc-en
        uses: actions/checkout@v7
        with:
          repository: php/doc-en
          path: en

        # GH actions/checkout, automatically merges, but tends to get stuck in the past.
        # See: https://github.com/php/doc-base/pull/329

      - name: Checkout and merge doc-pt_br
        uses: actions/checkout@v7
        with:
          path: pt_br

      - name: Build manual.xml
        run: |
          php doc-base/configure.php --disable-libxml-check --enable-xml-details --redirect-stderr-to-stdout --with-lang=pt_br 2>&1
          sha1sum doc-base/temp/manual.xml



      - name: Alternative path, uses userland merge instead
        run:  rm -rf pt_br

        # Merge into main/master from *current* names/SHAS.
        #
        # - github.event.pull_request.base.ref : main/master
        # - github.event.pull_request.head.sha : PR head
        #
        # Does not work:
        # - actions/checkout without fetch-depth / fetch-tags
        # - git fetch by github.event.pull_request.head.ref

      - name: Checkout doc-pt_br
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          path: pt_br
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Squash merge doc-pt_br
        run: |

          cd pt_br
          git show-ref -d --head
          echo

          # Give the detached head a name, to avoid warnings
          git switch -c head-${{ github.event.pull_request.head.sha }}
          echo

          # Checkout default branch by name, to always get the current head
          git checkout ${{ github.event.pull_request.base.ref }}
          echo

          # Squash merge, from the PR branch head SHA
          git -c user.name="nobody" -c user.email="nobody@example.com" merge --squash ${{ github.event.pull_request.head.sha }}
          echo

          git status --short
          git diff --stat
          echo

      - name: Build manual.xml, again
        run: |
          php doc-base/configure.php --disable-libxml-check --enable-xml-details --redirect-stderr-to-stdout --with-lang=pt_br 2>&1
          sha1sum doc-base/temp/manual.xml






      - name: Extra alternative, --no-commit avoids ident error?
        run:  rm -rf pt_br

      - name: Checkout doc-pt_br
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          path: pt_br
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Squash merge doc-pt_br
        run: |

          cd pt_br
          git show-ref -d --head
          echo

          # Give the PR detached head a name, to avoid warnings
          git branch head-${{ github.event.pull_request.head.sha }}
          echo

          # Checkout default branch by name, to always get the current head
          git checkout ${{ github.event.pull_request.base.ref }}
          echo

          # Squash and "merge" changes from the PR branch, v1, -c
          git -c user.name="none" -c user.email="none@example.com" merge -q --squash ${{ github.event.pull_request.head.sha }}
          git -c user.name="none" -c user.email="none@example.com" commit -m "Squash merge"
          echo

          git reset --hard HEAD~1
          echo

          # Squash and "merge" changes from the PR branch, v2, --no-commit
          git merge --squash --no-commit ${{ github.event.pull_request.head.sha }}
          git -c user.name="none" -c user.email="none@example.com" commit -m "Squash merge"
          echo

          git status --short
          git diff --stat
          echo
