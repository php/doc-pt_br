
name: Check build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: pwd start
        run: |
          echo -- start
          pwd
          ls
          echo -- parent
          ls ..

      # Testando se a documentação da sintaxe de actions/checkout sequer é valida
      # https://github.com/actions/checkout#push-a-commit-using-the-built-in-token

      - name: pwd ls
        run: |
          pwd
          ls

      - name: Checkout doc-base
        uses: actions/checkout@v7
        with:
          repository: php/doc-base
          path: doc-base

      - name: pwd ls
        run: |
          pwd
          ls

      - name: Checkout doc-en
        uses: actions/checkout@v7
        with:
          repository: php/doc-en
          path: en

      - name: pwd ls
        run: |
          pwd
          ls

      - name: Checkout doc-pt_br (prev)
        uses: actions/checkout@v7
        with:
          path: pt_br_prev

      - name: pwd ls
        run: |
          pwd
          ls

      - name: Checkout doc-pt_br (next)
        uses: actions/checkout@v7
        with:
          path: pt_br
          ref: ${{ github.event.pull_request.head.sha }}

      - name: pwd ls
        run: |
          pwd
          ls

      - name: Merge from main/master (always)
        run: |
          echo ---      ONE
          pwd
          echo ---      branch
          git  branch
          echo ---      status
          git  status
          echo ---      remote
          git  remote -v
          echo ---      log
          git  log -2
          # echo ---      pull/merge
          # git pull --rebase master
          # git log -2

          echo ---      TWO
          pwd
          echo ---      branch
          git  -C pt_br branch
          echo ---      status
          git  -C pt_br status
          echo ---      remote
          git  -C pt_br remote -v
          echo ---      log
          git  -C pt_br log -2
          # echo ---      pull/merge
          # git -C pt_br pull --rebase master
          # git -C pt_br log -2

      # Testando pushd modifica caminho permanentemente

      - name: pwd pushd pwd
        run: |
          echo ONE
          pwd
          ls
          pushd ..
          echo ONE
          pwd
          ls

      - name: pwd ls
        run: |
          pwd
          ls

      # Testando para onde o cd puro vai

      - name: cd pwd
        run: |
          cd
          pwd

      - name: env
        run: env

      - name: QA scripts
        run:  php doc-base/scripts/qa/extensions.xml.php --check

      - name: Build documentation for pt_br
        run: php doc-base/configure.php --disable-libxml-check --enable-xml-details --redirect-stderr-to-stdout --with-lang=pt_br 2>&1
