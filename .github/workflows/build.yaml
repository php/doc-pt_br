
name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: Checkout doc-base
        uses: actions/checkout@v7
        with:
          repository: php/doc-base
          path: doc-base

      - name: Checkout doc-en
        uses: actions/checkout@v7
        with:
          repository: php/doc-en
          path: en

      # GH actions/checkout, automaticaly merges, but tends to get stuck in the past.
      # See: https://github.com/php/doc-base/pull/329

      - name: Checkout doc-pt_br (automatic merge)
        uses: actions/checkout@v7
        with:
          path: pt_br_prev

      # Naked checkout

      - name: Checkout doc-pt_br (no merge)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          path: pt_br
          ref: ${{ github.event.pull_request.head.sha }}

      # Fetches, checkout, and merge know names.
      #
      # - github.event.pull_request.base.ref : main/master
      # - github.event.pull_request.head.sha : PR head
      #
      # Does not work:
      # - Fetch by github.event.pull_request.head.ref
      # - ?? without fetch-depth / fetch-tags

      - name: Merge from main/master (always)
        run: |
          git --version

          cd pt_br

          # Give the detached head a name, to avoid warnings
          git switch -c detached-${{ github.event.pull_request.head.sha }}
          echo

          # Fetch history of two points, for rebase tree walking (necessary?)
          git fetch origin ${{ github.event.pull_request.base.ref }}
          echo
          git fetch origin ${{ github.event.pull_request.head.sha }}
          echo
          git remote -v
          git show-ref -d --head
          echo

          # Checkout main/master, by name, to reaach it's last commit
          git checkout ${{ github.event.pull_request.base.ref }}
          echo

          # Squash and merge, from the branch SHA
          git merge --squash ${{ github.event.pull_request.head.sha }}
          echo

          git status --short
          echo
          git diff --stat
          echo

      # Testando cs modifica caminho permanentemten

      - name: ls doc-base/temp
        run: |
          pwd
          echo
          ls
          echo
          ls doc-base/temp

      # Testando pushd modifica caminho permanentemente

      - name: pwd pushd pwd
        run: |
          echo ONE
          pwd
          ls
          pushd ..
          echo ONE
          pwd
          ls

      - name: pwd ls
        run: |
          pwd
          ls

      # Testando para onde o cd puro vai

      - name: cd pwd
        run: |
          cd
          pwd

      - name: env
        run: env

      - name: QA scripts
        run:  php doc-base/scripts/qa/extensions.xml.php --check

      - name: Build documentation for pt_br
        run: php doc-base/configure.php --disable-libxml-check --enable-xml-details --redirect-stderr-to-stdout --with-lang=pt_br 2>&1
