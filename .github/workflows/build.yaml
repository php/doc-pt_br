
name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      - name: Checkout doc-base
        uses: actions/checkout@v7
        with:
          repository: php/doc-base
          path: doc-base

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      - name: Checkout doc-en
        uses: actions/checkout@v7
        with:
          repository: php/doc-en
          path: en

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      - name: Checkout doc-pt_br (prev)
        uses: actions/checkout@v7
        with:
          path: pt_br_prev

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls

      # Checkout branch, unmerged

      - name: Checkout doc-pt_br (next)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          path: pt_br
          ref: ${{ github.event.pull_request.head.sha }}

      - name: pwd ls
        run: |
          echo -- pwd
          pwd
          echo -- ls
          ls


      # Fetches, checkout, and merge know names.
      #
      # - github.event.pull_request.base.ref : main/master
      # - github.event.pull_request.head.sha : PR head
      #
      # Does not work:
      # - Fetch by github.event.pull_request.head.ref
      #

      - name: Merge from main/master (always)
        run: |
          git --version

          # Give the detached head a name, to avoid warnings
          git -C pt_br switch -c detached-${{ github.event.pull_request.head.sha }}
          echo

          # Fetch history of two points to be rebased (necessary?)
          git -C pt_br remote -v
          git -C pt_br show-ref -d --head
          echo
          git -C pt_br fetch origin ${{ github.event.pull_request.base.ref }}
          echo
          git -C pt_br fetch origin ${{ github.event.pull_request.head.sha }}
          echo
          git -C pt_br remote -v
          git -C pt_br show-ref -d --head
          echo

          # Checkout main/master, by name, to reaach it's last commit
          git -C pt_br checkout ${{ github.event.pull_request.base.ref }}
          echo

          # Squash and merge, from the branch SHA
          git -C pt_br merge --squash ${{ github.event.pull_request.head.sha }}
          git -C pt_br log -3 --oneline
          echo

          git -C pt_br status
          echo
          git -C pt_br diff
          echo ---

          cd pt_br

      # Testando cs modifica caminho permanentemten

      - name: ls doc-base/temp
        run: |
          pwd
          ls pt_br/doc-base/temp

      # Testando pushd modifica caminho permanentemente

      - name: pwd pushd pwd
        run: |
          echo ONE
          pwd
          ls
          pushd ..
          echo ONE
          pwd
          ls

      - name: pwd ls
        run: |
          pwd
          ls

      # Testando para onde o cd puro vai

      - name: cd pwd
        run: |
          cd
          pwd

      - name: env
        run: env

      - name: QA scripts
        run:  php doc-base/scripts/qa/extensions.xml.php --check

      - name: Build documentation for pt_br
        run: php doc-base/configure.php --disable-libxml-check --enable-xml-details --redirect-stderr-to-stdout --with-lang=pt_br 2>&1
