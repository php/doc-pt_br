
name: Build XML

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Run configure
    runs-on: ubuntu-latest
    steps:

      # Clone default branches and merge PR using only plain git:
      #
      # - clone --single-branch selects the default branch;
      # - clone --depth=1 downloads the same data as actions/checkout;
      # - github.event.pull_request.head.sha maps to PR tip, unmerged.
      #
      # Avoids getting stuck in the past, like actions/checkout does, and
      # we do not need any auth stuff for building the manual. So the results
      # of workflow re-runs always match with results of normal or squash
      # merging the pull requests.

      - name: Set up files
        run: |
          # Checkout repositories
          git --version
          set -x
          git -q clone --single-branch --depth=1 https://github.com/php/doc-base.git  doc-base
          git -q clone --single-branch --depth=1 https://github.com/php/doc-en.git    en
          git -q clone --single-branch           https://github.com/php/doc-pt_br.git pt_br

      - name: Merge pull request
        run: |
          # Plain git merge
          set -x
          cd  pt_br
          git config user.name  "nobody"
          git config user.email "nobody@example.com"
          git fetch -q --no-tags --prune --no-recurse-submodules origin ${{ github.event.pull_request.head.sha }}
          git merge -q -m "Merge" ${{ github.event.pull_request.head.sha }}

      - name: Build manual.xml
        run: |
          php doc-base/configure.php --disable-libxml-check --enable-xml-details --redirect-stderr-to-stdout --with-lang=pt_br 2>&1
          echo
          sha1sum doc-base/temp/manual.xml
